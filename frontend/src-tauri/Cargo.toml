[package]
name = "myu-wholesale-system"
version = "1.0.0"
description = "MYU Medicine & Surgical Wholesale Management System"
authors = ["MYU Systems"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open", "dialog-all", "fs-all", "path-all", "protocol-asset"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.29", features = ["bundled"] }
chrono = "0.4"
directories = "5.0"

[features]
# default features
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
